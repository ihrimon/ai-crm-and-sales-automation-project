# CI — Milestone M0 laid down lint+typecheck+build; Milestone M1 (Auth) added
# the `test` step plus the Postgres service it needs for the register→login
# integration test (docs/development-plan/README.md#m1--database--auth--size-m).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: ai_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/ai_crm?schema=public
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 30d

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter @ai-crm/api prisma:deploy

      - run: pnpm test

      - run: pnpm build
