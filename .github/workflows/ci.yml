# CI — Milestone M0 laid down lint+typecheck+build; Milestone M1 (Auth) added
# the `test` step plus the Postgres service it needs for the register→login
# integration test (docs/development-plan/README.md#m1--database--auth--size-m).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: ai_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DATABASE_URL (superuser "crm") is for Prisma Migrate only — it also
      # creates the "crm_app" role (migration 20260827084203_..., M2). That
      # migration hardcodes crm_app's password (dev-only credential, same
      # reasoning as "crm_dev_password" elsewhere), so APP_DATABASE_URL here
      # must match it exactly — it isn't set by the postgres service's own
      # env vars the way DATABASE_URL's "crm" password is. The app/tests
      # connect via APP_DATABASE_URL, never DATABASE_URL — see
      # apps/api/src/common/prisma/prisma.service.ts for why.
      DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/ai_crm?schema=public
      APP_DATABASE_URL: postgresql://crm_app:crm_app_dev_password@localhost:5432/ai_crm?schema=public
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 30d

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter @ai-crm/api prisma:deploy

      - run: pnpm test

      - run: pnpm build
